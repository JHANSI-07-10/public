<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    
    <linearGradient id="goldBeam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF2C2"/>
      <stop offset="40%" stop-color="#DFC067"/>
      <stop offset="100%" stop-color="#9E7D23"/>
    </linearGradient>

    <linearGradient id="plateTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1C1A14" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0E0E0C" stop-opacity="0.98"/>
    </linearGradient>

    <linearGradient id="plateSide1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A2415"/>
      <stop offset="100%" stop-color="#12100A"/>
    </linearGradient>

    <linearGradient id="plateSide2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1F1B12"/>
      <stop offset="100%" stop-color="#0A0906"/>
    </linearGradient>

    <linearGradient id="conduitGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#DFC067" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#DFC067" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#DFC067" stop-opacity="0.1"/>
    </linearGradient>

    
    <radialGradient id="heroAtmosphere" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#DFC067" stop-opacity="0.16"/>
      <stop offset="40%" stop-color="#C9A84C" stop-opacity="0.06"/>
      <stop offset="80%" stop-color="#0A0A0A" stop-opacity="0.01"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0"/>
    </radialGradient>

    
    <filter id="bloom" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="intenseBloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blurLg"/>
      <feMerge>
        <feMergeNode in="blurLg"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  
