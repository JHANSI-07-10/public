<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="gold1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3d57b"/>
      <stop offset="1" stop-color="#a98428"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c9a84c" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#c9a84c" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#c9a84c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloS" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f3d57b" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#f3d57b" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .wire { fill: none; stroke: #c9a84c; stroke-opacity: .28; stroke-width: 1.5; }
      .wireFaint { fill: none; stroke: #c9a84c; stroke-opacity: .14; stroke-width: 1; }
      .node { fill: url(#gold1); }
      .ring { fill: none; stroke: #c9a84c; stroke-opacity: .35; }
      .doc { fill: #141414; stroke: #c9a84c; stroke-opacity: .4; stroke-width: 1.5; }
      .line { stroke: #c9a84c; stroke-opacity: .5; stroke-width: 3; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#0a0a0a"/>

  <!-- Wide golden halo behind the headline area -->
  <ellipse cx="1250" cy="430" rx="720" ry="480" fill="url(#halo)"/>

  <!-- Perspective floor grid -->
  <g class="wireFaint" opacity="0.55">
    <path d="M0,940 L1920,760"/>
    <path d="M0,860 L1920,700"/>
    <path d="M0,790 L1920,650"/>
    <path d="M120,1080 L560,620"/>
    <path d="M480,1080 L840,620"/>
    <path d="M860,1080 L1130,620"/>
    <path d="M1250,1080 L1420,620"/>
    <path d="M1640,1080 L1710,620"/>
  </g>

  <!-- Knowledge network: document nodes wired into a central spine -->
  <g filter="url(#soft)">
    <!-- connection wires -->
    <path class="wire" d="M1040,300 C1180,300 1200,470 1340,470"/>
    <path class="wire" d="M1560,250 C1450,250 1420,430 1330,430"/>
    <path class="wire" d="M1650,560 C1500,560 1470,490 1380,490"/>
    <path class="wire" d="M1120,680 C1230,680 1260,540 1330,520"/>
    <path class="wire" d="M1760,390 C1680,390 1660,450 1560,455"/>
    <path class="wireFaint" d="M1040,300 C960,300 940,380 880,390"/>
    <path class="wireFaint" d="M1120,680 C1040,700 1020,640 940,650"/>
    <path class="wireFaint" d="M1650,560 C1730,590 1740,650 1820,670"/>

    <!-- central synthesis node -->
    <circle cx="1355" cy="470" r="70" fill="#0e0e0e" stroke="url(#gold1)" stroke-width="2" stroke-opacity="0.7"/>
    <circle cx="1355" cy="470" r="96" class="ring" stroke-dasharray="6 10" opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" from="0 1355 470" to="360 1355 470" dur="40s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1355" cy="470" r="122" class="ring" stroke-dasharray="2 14" opacity="0.3"/>
    <circle cx="1355" cy="470" r="14" fill="url(#gold1)" filter="url(#soft)"/>
    <circle cx="1355" cy="470" r="26" fill="url(#haloS)"/>

    <!-- document cards -->
    <g transform="translate(920,220)">
      <rect class="doc" width="120" height="150" rx="10"/>
      <line class="line" x1="18" y1="34" x2="102" y2="34"/>
      <line class="line" x1="18" y1="58" x2="84" y2="58" opacity="0.6"/>
      <line class="line" x1="18" y1="82" x2="96" y2="82" opacity="0.4"/>
      <line class="line" x1="18" y1="106" x2="70" y2="106" opacity="0.3"/>
      <circle cx="102" cy="132" r="5" class="node"/>
    </g>
    <g transform="translate(1560,140)">
      <rect class="doc" width="120" height="110" rx="10"/>
      <line class="line" x1="18" y1="32" x2="102" y2="32"/>
      <line class="line" x1="18" y1="56" x2="78" y2="56" opacity="0.5"/>
      <line class="line" x1="18" y1="80" x2="92" y2="80" opacity="0.35"/>
    </g>
    <g transform="translate(1650,560)">
      <rect class="doc" width="140" height="96" rx="10"/>
      <polyline points="18,70 46,44 68,58 96,26 122,38" fill="none" stroke="url(#gold1)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
      <line class="line" x1="18" y1="24" x2="70" y2="24" opacity="0.4"/>
    </g>
    <g transform="translate(1040,660)">
      <rect class="doc" width="110" height="90" rx="10"/>
      <circle cx="34" cy="34" r="14" fill="none" stroke="#c9a84c" stroke-width="2.5" stroke-opacity="0.7"/>
      <line class="line" x1="58" y1="34" x2="92" y2="34" opacity="0.5"/>
      <line class="line" x1="18" y1="64" x2="88" y2="64" opacity="0.35"/>
    </g>

    <!-- junction nodes -->
    <circle cx="1040" cy="300" r="6" class="node"/>
    <circle cx="1560" cy="250" r="6" class="node"/>
    <circle cx="1650" cy="560" r="6" class="node"/>
    <circle cx="1120" cy="680" r="6" class="node"/>
    <circle cx="1760" cy="390" r="5" class="node" opacity="0.8"/>
    <circle cx="880" cy="390" r="4" class="node" opacity="0.6"/>
    <circle cx="940" cy="650" r="4" class="node" opacity="0.6"/>
    <circle cx="1820" cy="670" r="4" class="node" opacity="0.6"/>

    <!-- travelling data sparks along the main wires -->
    <circle r="4" fill="#f3d57b" filter="url(#soft)">
      <animateMotion dur="5s" repeatCount="indefinite" path="M1040,300 C1180,300 1200,470 1340,470"/>
    </circle>
    <circle r="4" fill="#f3d57b" filter="url(#soft)">
      <animateMotion dur="6s" begin="1.5s" repeatCount="indefinite" path="M1560,250 C1450,250 1420,430 1330,430"/>
    </circle>
    <circle r="3.5" fill="#f3d57b" filter="url(#soft)">
      <animateMotion dur="5.5s" begin="0.8s" repeatCount="indefinite" path="M1650,560 C1500,560 1470,490 1380,490"/>
    </circle>
    <circle r="3.5" fill="#f3d57b" filter="url(#soft)">
      <animateMotion dur="6.5s" begin="2.2s" repeatCount="indefinite" path="M1120,680 C1230,680 1260,540 1330,520"/>
    </circle>
  </g>

  <!-- scattered particles -->
  <g fill="#c9a84c">
    <circle cx="300" cy="200" r="2" opacity="0.35"/>
    <circle cx="520" cy="120" r="1.5" opacity="0.25"/>
    <circle cx="700" cy="330" r="2.5" opacity="0.3"/>
    <circle cx="420" cy="520" r="1.5" opacity="0.2"/>
    <circle cx="820" cy="820" r="2" opacity="0.3"/>
    <circle cx="1480" cy="860" r="2" opacity="0.3"/>
    <circle cx="1860" cy="180" r="2" opacity="0.3"/>
    <circle cx="1240" cy="120" r="1.5" opacity="0.25"/>
    <circle cx="1700" cy="820" r="2.5" opacity="0.28"/>
    <circle cx="960" cy="140" r="2" opacity="0.22"/>
  </g>

  <!-- deep vignette -->
  <rect width="1920" height="1080" fill="url(#halo)" opacity="0" />
</svg>
